<c-row><c-col xs="12"><c-card class="table-card"><c-card-header class="d-flex justify-content-between"><strong>Profiles</strong><button
                    cButton color="primary" (click)="createVisible.set(true)">Add
                    profile</button></c-card-header><c-card-body>
                <div class="table-responsive">
                <table cTable [hover]="true" class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>@for (profile of profiles(); track profile.id) { <tr>
                            <td>{{ profile.name }}</td>
                            <td>{{ profile.description }}</td>
                            <td>{{ profile.status }}</td>
                        </tr> } @empty { <tr>
                            <td colspan="3" class="empty-state">No profiles found.</td>
                        </tr> }</tbody>
                </table>
                </div>@if (errorMessage()) { <div class="alert alert-danger">{{ errorMessage() }}</div> }
            </c-card-body></c-card></c-col></c-row><c-modal [(visible)]="createVisible"
    alignment="center"><c-modal-header>
        <h5 cModalTitle>Create profile</h5>
    </c-modal-header><c-modal-body><app-profile-form (cancelled)="createVisible.set(false)"
            (created)="onCreated()" /></c-modal-body></c-modal>
