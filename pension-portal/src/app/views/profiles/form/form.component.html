<form [formGroup]="form" (ngSubmit)="save()" class="row g-3"><div class="col-12"><label class="form-label">Profile name</label><input cFormControl formControlName="name"></div><div class="col-12"><label class="form-label">Description</label><textarea cFormControl formControlName="description"></textarea></div><div class="col-12"><label class="form-label">Status</label><select cSelect formControlName="status">@for (status of statuses; track status) { <option [value]="status">{{ status }}</option> }</select></div>@if (errorMessage()) { <div class="col-12 text-danger">{{ errorMessage() }}</div> }<div class="col-12 d-flex justify-content-end gap-2"><button cButton type="button" color="secondary" variant="outline" (click)="cancelled.emit()">Cancel</button><button cButton type="submit" color="primary" [disabled]="saving()">Create profile</button></div></form>
