<c-row><c-col xs="12"><c-card class="table-card"><c-card-header><strong>Permissions</strong></c-card-header><c-card-body><div class="table-responsive"><table cTable [hover]="true" class="data-table"><thead><tr><th>Permission</th><th>Role ID</th></tr></thead><tbody>@for (permission of permissions(); track permission.id) { <tr><td>{{ permission.permission }}</td><td>{{ permission.roleId ?? '—' }}</td></tr> } @empty { <tr><td colspan="2" class="empty-state">No permissions found.</td></tr> }</tbody></table></div>@if (errorMessage()) { <div class="alert alert-danger">{{ errorMessage() }}</div> }</c-card-body></c-card></c-col></c-row>
