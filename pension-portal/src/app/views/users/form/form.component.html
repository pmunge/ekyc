<form [formGroup]="usersForm" (ngSubmit)="save()" class="row g-3">
  @if (errorMessage()) { <div class="col-12"><div class="alert alert-danger mb-0">{{ errorMessage() }}</div></div> }
  <div class="col-md-6"><label class="form-label" for="username">Username</label><input cFormControl id="username" formControlName="username" [class.is-invalid]="usersForm.controls.username.touched && usersForm.controls.username.invalid"><div class="invalid-feedback">A username of at least 3 characters is required.</div></div>
  <div class="col-md-6"><label class="form-label" for="profile">Profile</label><select cSelect id="profile" formControlName="profileId" [class.is-invalid]="usersForm.controls.profileId.touched && usersForm.controls.profileId.invalid"><option value="" disabled>Select a profile</option>@for (profile of profiles(); track profile.id) { <option [value]="profile.id">{{ profile.name }}</option> }</select><div class="invalid-feedback">Select the profile to assign.</div></div>
  <div class="col-md-4"><label class="form-label" for="firstName">First name</label><input cFormControl id="firstName" formControlName="firstName" [class.is-invalid]="usersForm.controls.firstName.touched && usersForm.controls.firstName.invalid"><div class="invalid-feedback">First name is required.</div></div>
  <div class="col-md-4"><label class="form-label" for="middleName">Middle name</label><input cFormControl id="middleName" formControlName="middleName"></div>
  <div class="col-md-4"><label class="form-label" for="surName">Surname</label><input cFormControl id="surName" formControlName="surName" [class.is-invalid]="usersForm.controls.surName.touched && usersForm.controls.surName.invalid"><div class="invalid-feedback">Surname is required.</div></div>
  <div class="col-md-6"><label class="form-label" for="email">Email</label><input cFormControl id="email" type="email" formControlName="email" [class.is-invalid]="usersForm.controls.email.touched && usersForm.controls.email.invalid"><div class="invalid-feedback">Enter a valid email address.</div></div>
  <div class="col-md-6"><label class="form-label" for="phoneNumber">Phone number</label><input cFormControl id="phoneNumber" formControlName="phoneNumber"></div>
  <div class="col-md-6"><label class="form-label" for="idNumber">ID number</label><input cFormControl id="idNumber" formControlName="idNumber"></div>
  <div class="col-md-6"><label class="form-label" for="county">County</label><input cFormControl id="county" formControlName="county"></div>
  <div class="col-12 d-flex justify-content-end gap-2"><button cButton type="button" color="secondary" variant="outline" (click)="cancelled.emit()" [disabled]="saving()">Cancel</button><button cButton type="submit" color="primary" [disabled]="saving()">@if (saving()) { <c-spinner size="sm" /> } @else { Create user }</button></div>
</form>
