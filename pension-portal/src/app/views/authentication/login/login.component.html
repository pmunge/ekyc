<div class="login-layout">

  <!-- Left: form panel -->
  <section class="login-panel">
    <header class="brand">
      <img src="assets/images/loginlogo.png" alt="ICEA Pay" class="brand-logo">
    </header>

    <div class="form-wrap">
      <img src="assets/images/logo1.png" alt="ICEA Pay" class="product-logo">
      <p class="subtitle">Sign in to access the eKYC</p>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form" novalidate>

        <label class="field">
          <span class="field-label">Country</span>
          <select formControlName="countryCode" aria-label="Country">
            @for (country of countries(); track country.code) {
            <option [value]="country.code">{{ country.name }} ({{ country.callingCode }})</option>
            }
          </select>
          @if (loginForm.controls.countryCode.touched && loginForm.controls.countryCode.invalid) {
          <span class="field-error">Select a country</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Phone number</span>
          <div class="phone-row">
            <span class="dial-code">{{ selectedCallingCode() }}</span>
            <input type="tel" formControlName="phoneNumber" placeholder="7********" autocomplete="tel">
          </div>
          @if (loginForm.controls.phoneNumber.touched && loginForm.controls.phoneNumber.invalid) {
          <span class="field-error">Enter a valid phone number</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" formControlName="password" placeholder="••••••••••" autocomplete="current-password">
          @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <span class="field-error">Password is required</span>
          }
        </label>

        @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          {{ loading() ? 'Signing in…' : 'Sign In' }}
        </button>

      </form>
    </div>
  </section>

  <!-- Right: image panel -->
  <aside class="image-panel">
    <img src="assets/images/login.png" alt="ICEA Lion headquarters" class="image-panel-bg">
    <div class="image-overlay">
      <span class="overlay-top">ICEA LION</span>
      <div class="overlay-bottom">
        <h2 class="overlay-heading">eKYC</h2>
        <p class="overlay-text">
          Manage pensioner enrollments, Advances and approvals across the
          group from a single secure dashboard.
        </p>
      </div>
    </div>
  </aside>

</div>
